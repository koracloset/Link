<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kora Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF; --text:#1A1A1A; --muted:#8A8580; --accent:#E8897A; --card:#FFFFFF; --line:#EADFD3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#191715; --text:#F5EFE6; --muted:#A39D95; --card:#242120; --line:#38332F; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#191715; --text:#F5EFE6; --muted:#A39D95; --card:#242120; --line:#38332F; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:56px 24px 40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;font-size:56px;letter-spacing:.12em;line-height:1;margin:14px 0 4px}
.sub{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin:0 0 20px}
.logo-wrap{width:100%;max-width:320px;margin:0 auto 18px;border-radius:16px}
.logo-img{display:block;width:100%;height:auto;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-wrap{background:#FAF6EF;padding:4px}}
:root[data-theme="dark"] .logo-wrap{background:#FAF6EF;padding:4px}
.tag{font-size:15px;color:var(--muted);margin:0 0 36px;max-width:300px;line-height:1.5}
.links{width:100%;display:flex;flex-direction:column;gap:14px}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 20px;border-radius:14px;text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--text);transition:transform .12s ease}
a.btn:active{transform:scale(.98)}
a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
a.btn svg{width:20px;height:20px;flex:none}
footer{margin-top:44px;font-size:12px;color:var(--muted)}
</style>
</head>
